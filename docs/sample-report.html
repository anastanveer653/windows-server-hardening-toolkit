T1558"],"links":[]},{"id":"ACCT-001","title":"Minimum password length","category":"AccountPolicy","severity":"High","status":"Pass","expected":"\u003e= 14","actual":"14","detail":"Compliant.","remediation":"Set local security policy MinimumPasswordLength = 14 (secedit).","auditOnly":false,"rebootRequired":false,"rationale":"Password length is the strongest single factor against offline cracking and guessing attacks.","impact":"Applies at the next password change of local accounts. On domain members, domain password policy applies to domain accounts.","benchmark":"CIS: Minimum password length = 14 or more character(s)","mitreAttack":["T1110","T1110.002"],"links":[]},{"id":"ACCT-002","title":"Password history size","category":"AccountPolicy","severity":"Medium","status":"Fail","expected":"\u003e= 24","actual":"Non-compliant value","detail":"Not compliant.","remediation":"Set local security policy PasswordHistorySize = 24 (secedit).","auditOnly":false,"rebootRequired":false,"rationale":"Stops users from cycling back to previously compromised passwords.","impact":"","benchmark":"CIS: Enforce password history = 24 or more password(s)","mitreAttack":["T1110"],"links":[]},{"id":"ACCT-003","title":"Maximum password age","category":"AccountPolicy","severity":"Medium","status":"Pass","expected":"Between 1 and 365","actual":"365","detail":"Compliant.","remediation":"Set local security policy MaximumPasswordAge = 365 (secedit).","auditOnly":false,"rebootRequired":false,"rationale":"Passwords that never expire (value -1 or 0) remain valid indefinitely after a silent compromise.","impact":"","benchmark":"CIS: Maximum password age = 365 or fewer days, but not 0","mitreAttack":["T1078"],"links":[]},{"id":"ACCT-004","title":"Minimum password age","category":"AccountPolicy","severity":"Low","status":"Pass","expected":"\u003e= 1","actual":"1","detail":"Compliant.","remediation":"Set local security policy MinimumPasswordAge = 1 (secedit).","auditOnly":false,"rebootRequired":false,"rationale":"Without a minimum age, users can immediately cycle through the password history and reuse their old password.","impact":"","benchmark":"CIS: Minimum password age = 1 or more day(s)","mitreAttack":["T1110"],"links":[]},{"id":"ACCT-005","title":"Passwords must meet complexity requirements","category":"AccountPolicy","severity":"High","status":"Pass","expected":"1","actual":"1","detail":"Compliant.","remediation":"Set local security policy PasswordComplexity = 1 (secedit).","auditOnly":false,"rebootRequired":false,"rationale":"Complexity rules prevent dictionary words and account names from being used as passwords.","impact":"","benchmark":"CIS: Password must meet complexity requirements = Enabled","mitreAttack":["T1110.001","T1110.003"],"links":[]},{"id":"ACCT-006","title":"Passwords are not stored using reversible encryption","category":"AccountPolicy","severity":"High","status":"Pass","expected":"0","actual":"0","detail":"Compliant.","remediation":"Set local security policy ClearTextPassword = 0 (secedit).","auditOnly":false,"rebootRequired":false,"rationale":"Reversible encryption is equivalent to storing passwords in cleartext.","impact":"","benchmark":"CIS: Store passwords using reversible encryption = Disabled","mitreAttack":["T1003"],"links":[]},{"id":"ACCT-007","title":"Account lockout threshold","category":"AccountPolicy","severity":"High","status":"Pass","expected":"Between 1 and 5","actual":"5","detail":"Compliant.","remediation":"Set local security policy LockoutBadCount = 5 (secedit).","auditOnly":false,"rebootRequired":false,"rationale":"A threshold of 0 never locks accounts, allowing unlimited online password guessing.","impact":"Accounts lock after repeated failures, which can be abused for denial of service against known account names.","benchmark":"CIS: Account lockout threshold = 5 or fewer invalid logon attempt(s), but not 0","mitreAttack":["T1110.001","T1110.003"],"links":[]},{"id":"ACCT-008","title":"Account lockout duration","category":"AccountPolicy","severity":"Medium","status":"Pass","expected":"\u003e= 15","actual":"15","detail":"Compliant.","remediation":"Set local security policy LockoutDuration = 15 (secedit).","auditOnly":false,"rebootRequired":false,"rationale":"A sufficient lockout duration slows down brute-force attacks to an impractical rate.","impact":"","benchmark":"CIS: Account lockout duration = 15 or more minute(s)","mitreAttack":["T1110"],"links":[]},{"id":"ACCT-009","title":"Reset account lockout counter after","category":"AccountPolicy","severity":"Medium","status":"Pass","expected":"\u003e= 15","actual":"15","detail":"Compliant.","remediation":"Set local security policy ResetLockoutCount = 15 (secedit).","auditOnly":false,"rebootRequired":false,"rationale":"A short observation window lets attackers spread guesses just below the lockout threshold.","impact":"Must be less than or equal to the lockout duration, otherwise secedit rejects the policy.","benchmark":"CIS: Reset account lockout counter after = 15 or more minute(s)","mitreAttack":["T1110.003"],"links":[]},{"id":"ACCT-010","title":"Built-in Guest account is disabled","category":"AccountPolicy","severity":"High","status":"Pass","expected":"0","actual":"0","detail":"Compliant.","remediation":"Set local security policy EnableGuestAccount = 0 (secedit).","auditOnly":false,"rebootRequired":false,"rationale":"The Guest account allows unauthenticated access to the server and its shares.","impact":"","benchmark":"CIS: Accounts: Guest account status = Disabled","mitreAttack":["T1078.001"],"links":[]},{"id":"LOG-001","title":"Advanced audit policy overrides legacy category settings","category":"AuditLogging","severity":"Medium","status":"Fail","expected":"1","actual":"Not configured","detail":"Not compliant.","remediation":"Set registry value HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Lsa\\SCENoApplyLegacyAuditPolicy (DWord) to 1.","auditOnly":false,"rebootRequired":false,"rationale":"Without this setting, legacy category-level aud "Medium","status":"NotApplicable","expected":"Disabled","actual":null,"detail":"Service \u0027RemoteRegistry\u0027 is not installed.","remediation":"Set service \u0027RemoteRegistry\u0027 startup type to Disabled and stop it.","auditOnly":false,"rebootRequired":false,"rationale":"Remote Registry lets remote users read and modify the registry, which is used for reconnaissance and lateral movement.","impact":"Some legacy monitoring and inventory tools that read the registry remotely stop working.","benchmark":"CIS: Remote Registry (RemoteRegistry) = Disabled","mitreAttack":["T1012","T1112"],"links":[]},{"id":"SVC-003","title":"Telnet server is disabled","category":"Services","severity":"High","status":"Error","expected":"Disabled","actual":null,"detail":"Access is denied.","remediation":"Set service \u0027TlntSvr\u0027 startup type to Disabled and stop it.","auditOnly":false,"rebootRequired":false,"rationale":"Telnet provides remote shell access with cleartext credentials.","impact":"","benchmark":"Hardening best practice: remove cleartext remote shells","mitreAttack":["T1021","T1040"],"links":[]},{"id":"SVC-004","title":"SNMP service is disabled","category":"Services","severity":"Medium","status":"Fail","expected":"Disabled","actual":"Non-compliant value","detail":"Not compliant.","remediation":"Set service \u0027SNMP\u0027 startup type to Disabled and stop it.","auditOnly":false,"rebootRequired":false,"rationale":"SNMP v1/v2c uses cleartext community strings and leaks detailed system and network information.","impact":"Monitoring systems that poll SNMP stop receiving data; prefer WMI/WinRM or SNMPv3 agents.","benchmark":"CIS: SNMP Service (SNMP) = Disabled or Not Installed","mitreAttack":["T1046","T1602.001"],"links":[]},{"id":"SVC-005","title":"Simple TCP/IP Services are disabled","category":"Services","severity":"Low","status":"Error","expected":"Disabled","actual":null,"detail":"Access is denied.","remediation":"Set service \u0027simptcp\u0027 startup type to Disabled and stop it.","auditOnly":false,"rebootRequired":false,"rationale":"Echo, discard, chargen and similar legacy services have no business use and can be abused for amplification.","impact":"","benchmark":"CIS: Simple TCP/IP Services (simptcp) = Disabled or Not Installed","mitreAttack":["T1046"],"links":[]},{"id":"SVC-006","title":"Remote Access Auto Connection Manager is disabled","category":"Services","severity":"Low","status":"NotApplicable","expected":"Disabled","actual":null,"detail":"Service \u0027RasAuto\u0027 is not installed.","remediation":"Set service \u0027RasAuto\u0027 startup type to Disabled and stop it.","auditOnly":false,"rebootRequired":false,"rationale":"Automatically dialing remote networks is not required on servers and increases attack surface.","impact":"","benchmark":"Microsoft guidance: disabling system services on Windows Server with Desktop Experience","mitreAttack":[],"links":[]},{"id":"SVC-007","title":"SSDP Discovery service is disabled","category":"Services","severity":"Low","status":"NotApplicable","expected":"Disabled","actual":null,"detail":"Service \u0027SSDPSRV\u0027 is not installed.","remediation":"Set service \u0027SSDPSRV\u0027 startup type to Disabled and stop it.","auditOnly":false,"rebootRequired":false,"rationale":"SSDP/UPnP discovery is a consumer feature that exposes the host to network discovery and UPnP attacks.","impact":"","benchmark":"Microsoft guidance: disabling system services on Windows Server with Desktop Experience","mitreAttack":["T1046"],"links":[]},{"id":"SVC-008","title":"UPnP Device Host service is disabled","category":"Services","severity":"Low","status":"Fail","expected":"Disabled","actual":"Non-compliant value","detail":"Not compliant.","remediation":"Set service \u0027upnphost\u0027 startup type to Disabled and stop it.","auditOnly":false,"rebootRequired":false,"rationale":"Hosting UPnP devices is not a server workload and adds unauthenticated network attack surface.","impact":"","benchmark":"Microsoft guidance: disabling system services on Windows Server with Desktop Experience","mitreAttack":["T1046"],"links":[]},{"id":"SVC-009","title":"Xbox Live Auth Manager service is disabled","category":"Services","severity":"Low","status":"NotApplicable","expected":"Disabled","actual":null,"detail":"Service \u0027XblAuthManager\u0027 is not installed.","remediation":"Set service \u0027XblAuthManager\u0027 startup type to Disabled and stop it.","auditOnly":false,"rebootRequired":false,"rationale":"Consumer gaming services have no place on a server and only add attack surface.","impact":"","benchmark":"Microsoft guidance: disabling system services on Windows Server with Desktop Experience","mitreAttack":[],"links":[]},{"id":"SVC-010","title":"Xbox Live Game Save service is disabled","category":"Services","severity":"Low","status":"NotApplicable","expected":"Disabled","actual":null,"detail":"Service \u0027XblGameSave\u0027 is not installed.","remediation":"Set service \u0027XblGameSave\u0027 startup type to Disabled and stop it.","auditOnly":false,"rebootRequired":false,"rationale":"Consumer gaming services have no place on a server and only add attack surface.","impact":"","benchmark":"Microsoft guidance: disabling system services on Windows Server with Desktop Experience","mitreAttack":[],"links":[]},{"id":"SVC-011","title":"Geolocation service is disabled","category":"Services","severity":"Low","status":"NotApplicable","expected":"Disabled","actual":null,"detail":"Service \u0027lfsvc\u0027 is not installed.","remediation":"Set service \u0027lfsvc\u0027 startup type to Disabled and stop it.","auditOnly":false,"rebootRequired":false,"rationale":"Location tracking is not needed on servers.","impact":"","benchmark":"Microsoft guidance: disabling system services on Windows Server with Desktop Experience","mitreAttack":[],"links":[]},{"id":"SVC-012","title":"Downloaded Maps Manager service is disabled","category":"Services","severity":"Low","status":"NotApplicable","expected":"Disabled","actual":null,"detail":"Service \u0027MapsBroker\u0027 is not installed.","remediation":"Set service \u0027MapsBroker\u0027 startup type to Disabled and stop it.","auditOnly":false,"rebootRequired":false,"rationale":"Offline maps are a client feature that is not needed on servers.","impact":"","benchmark":"Microsoft guidance: disabling system services on Windows Server with Desktop Experience","mitreAttack":[],"links":[]},{"id":"SVC-013","title":"Windows Mobile Hotspot service is disabled","category":"Services","severity":"Medium","status":"Fail","expected":"Disabled","actual":"Non-compliant value","detail":"Not compliant.","remediation":"Set service \u0027icssvc\u0027 startup type to Disabled and stop it.","auditOnly":false,"rebootRequired":false,"rationale":"A mobile hotspot could bridge the server network to an uncontrolled wireless network.","impact":"","benchmark":"Microsoft guidance: disabling system services on Windows Server with Desktop Experience","mitreAttack":["T1133"],"links":[]},{"id":"SVC-014","title":"Remote Procedure Call Locator is disabled","category":"Services","severity":"Low","status":"Pass","expected":"Disabled","actual":"StartType=Disabled, Status=Stopped","detail":"Compliant.","remediation":"Set service \u0027RpcLocator\u0027 startup type to Disabled and stop it.","auditOnly":false,"rebootRequired":false,"rationale":"The legacy RPC name service is only needed by very old applications.","impact":"","benchmark":"Microsoft guidance: disabling system services on Windows Server with Desktop Experience","mitreAttack":[],"links":[]},{"id":"SYS-001","title":"User Account Control is enabled (Admin Approval Mode)","category":"System","severity":"High","status":"Fail","expected":"1","actual":"Not configured","detail":"Not compliant.","remediation":"Set registry value HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System\\EnableLUA (DWord) to 1.","auditOnly":false,"rebootRequired":false,"rationale":"With UAC disabled every administrator process runs with a full token, removing a key barrier against malware.","impact":"","benchmark":"CIS: User Account Control: Run all administrators in Admin Approval Mode = Enabled","mitreAttack":["T1548.002"],"links":[]},{"id":"SYS-002","title":"Admin Approval Mode applies to the built-in Administrator","category":"System","severity":"Medium","status":"Pass","expected":"1","actual":"1","detail":"Compliant.","remediation":"Set registry value HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System\\FilterAdministratorToken (DWord) to 1.","auditOnly":false,"rebootRequired":false,"rationale":"Without this, the built-in Administrator account always runs elevated and bypasses UAC entirely.","impact":"The built-in Administrator receives elevation prompts like other administrators.","benchmark":"CIS: User Account Control: Admin Approval Mode for the Built-in Administrator account = Enabled","mitreAttack":["T1548.002"],"links":[]},{"id":"SYS-003","title":"Elevation prompt for administrators uses the secure desktop","category":"System","severity":"Medium","status":"Pass","expected":"One of: 1, 2","actual":"2","detail":"Compliant.","remediation":"Set registry value HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System\\ConsentPromptBehaviorAdmin (DWord) to 2.","auditOnly":false,"rebootRequired":false,"rationale":"Prompting on the secure desktop prevents other processes from spoofing or auto-approving the elevation dialog.","impact":"","benchmark":"CIS: User Account Control: Behavior of the elevation prompt for administrators in Admin Approval Mode = Prompt for consent on the secure desktop","mitreAttack":["T1548.002"],"links":[]},{"id":"SYS-004","title":"UAC restrictions apply to local accounts on network logons","category":"System","severity":"High","status":"Fail","expected":"0","actual":"Not configured","detail":"Not compliant.","remediation":"Set registry value HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System\\LocalAccountTokenFilterPolicy (DWord) to 0.","auditOnly":false,"rebootRequired":false,"rationale":"Filtering the token of local administrators on network logons blocks pass-the-hash with local Administrator accounts.","impact":"Remote administration with local (non-domain) administrator accounts no longer receives full rights; use domain accounts or LAPS.","benchmark":"CIS: Apply UAC restrictions to local accounts on network logons = Enabled (member servers)","mitreAttack":["T1550.002","T1021.002"],"links":[]},{"id":"SYS-005","title":"AutoPlay is turned off for all drives","category":"System","severity":"Medium","status":"Fail","expected":"255","actual":"Not configured","detail":"Not compliant.","remediation":"Set registry value HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\Explorer\\NoDriveTypeAutoRun (DWord) to 255.","auditOnly":false,"rebootRequired":false,"rationale":"AutoPlay can launch content from removable or network media without user intent.","impact":"","benchmark":"CIS: Turn off Autoplay = Enabled: All drives","mitreAttack":["T1091"],"links":[]},{"id":"SYS-006","title":"AutoRun commands are not executed","category":"System","severity":"Medium","status":"Pass","expected":"1","actual":"1","detail":"Compliant.","remediation":"Set registry value HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\Explorer\\NoAutorun (DWord) to 1.","auditOnly":false,"rebootRequired":false,"rationale":"Blocks autorun.inf commands, a classic malware propagation method through USB devices.","impact":"","benchmark":"CIS: Set the default behavior for AutoRun = Enabled: Do not execute any autorun commands","mitreAttack":["T1091"],"links":[]},{"id":"SYS-007","title":"Last signed-in user name is not displayed","category":"System","severity":"Low","status":"Pass","expected":"1","actual":"1","detail":"Compliant.","remediation":"Set registry value HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System\\DontDisplayLastUserName (DWord) to 1.","auditOnly":false,"rebootRequired":false,"rationale":"Showing the last user name on the logon screen discloses valid (often administrative) account names.","impact":"","benchmark":"CIS: Interactive logon: Do not display last signed-in = Enabled","mitreAttack":["T1087"],"links":[]},{"id":"SYS-008","title":"Machine inactivity limit locks idle sessions","category":"System","severity":"Medium","status":"Fail","expected":"Between 1 and 900","actual":"Not configured","detail":"Not compliant.","remediation":"Set registry value HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System\\InactivityTimeoutSecs (DWord) to 900.","auditOnly":false,"rebootRequired":false,"rationale":"Unattended unlocked console and RDP sessions give anyone with physical or session access full control.","impact":"","benchmark":"CIS: Interactive logon: Machine inactivity limit = 900 or fewer second(s), but not 0","mitreAttack":["T1078"],"links":[]},{"id":"SYS-009","title":"Logon banner title is configured","category":"System","severity":"Low","status":"Pass","expected":"Authorized use only","actual":"Authorized use only","detail":"Compliant.","remediation":"Set registry value HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System\\LegalNoticeCaption (String) to Authorized use only.","auditOnly":false,"rebootRequired":false,"rationale":"A legal notice establishes that access is monitored and supports prosecution of unauthorized use.","impact":"","benchmark":"CIS: Interactive logon: Message title for users attempting to log on = configured","mitreAttack":[],"links":[]},{"id":"SYS-010","title":"Logon banner text is configured","category":"System","severity":"Low","status":"Pass","expected":"This system is for authorized use only. All activity is monitored and logged.","actual":"This system is for authorized use only. All activity is monitored and logged.","detail":"Compliant.","remediation":"Set registry value HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System\\LegalNoticeText (String) to This system is for authorized use only. All activity is monitored and logged..","auditOnly":false,"rebootRequired":false,"rationale":"A legal notice establishes that access is monitored and supports prosecution of unauthorized use.","impact":"","benchmark":"CIS: Interactive logon: Message text for users attempting to log on = configured","mitreAttack":[],"links":[]},{"id":"SYS-011","title":"Structured Exception Handling Overwrite Protection (SEHOP) is enabled","category":"System","severity":"Medium","status":"Pass","expected":"0","actual":"0","detail":"Compliant.","remediation":"Set registry value HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Session Manager\\kernel\\DisableExceptionChainValidation (DWord) to 0.","auditOnly":false,"rebootRequired":false,"rationale":"SEHOP blocks a widely used class of stack-based exploitation techniques.","impact":"","benchmark":"CIS: Enable Structured Exception Handling Overwrite Protection (SEHOP) = Enabled","mitreAttack":["T1203","T1068"],"links":[]},{"id":"SYS-012","title":"Data Execution Prevention covers all processes","category":"System","severity":"Medium","status":"Fail","expected":"One of: 1, 3","actual":"Non-compliant value","detail":"Not compliant.","remediation":"Manual: Run \"bcdedit /set {current} nx OptOut\" (or AlwaysOn) from an elevated prompt and restart.","auditOnly":true,"rebootRequired":false,"rationale":"DEP in OptOut or AlwaysOn mode prevents code execution from data pages for every process, not only for Windows components.","impact":"","benchmark":"Microsoft guidance: Data Execution Prevention","mitreAttack":["T1203","T1068"],"links":[]},{"id":"SYS-013","title":"UEFI Secure Boot is enabled","category":"System","severity":"Medium","status":"Pass","expected":"1","actual":"1","detail":"Compliant.","remediation":"Manual: Enable Secure Boot in the UEFI firmware (or the VM settings) and restart. Legacy BIOS installations must be converted to UEFI first (mbr2gpt).","auditOnly":true,"rebootRequired":false,"rationale":"Secure Boot ensures only signed boot loaders run, protecting against bootkits, and is a prerequisite for Credential Guard.","impact":"","benchmark":"Microsoft guidance: Secure the Windows boot process","mitreAttack":["T1542.003"],"links":[]},{"id":"RDP-001","title":"Network Level Authentication is required for RDP","category":"RemoteDesktop","severity":"High","status":"Pass","expected":"1","actual":"1","detail":"Compliant.","remediation":"Set registry value HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\Terminal Services\\UserAuthentication (DWord) to 1.","auditOnly":false,"rebootRequired":false,"rationale":"NLA authenticates users before a full RDP session is created, shielding the server from pre-authentication exploits such as BlueKeep (CVE-2019-0708) and resource exhaustion.","impact":"","benchmark":"CIS: Require user authentication for remote connections by using Network Level Authentication = Enabled","mitreAttack":["T1021.001","T1210"],"links":[]},{"id":"RDP-002","title":"RDP security layer is TLS","category":"RemoteDesktop","severity":"Medium","status":"Fail","expected":"2","actual":"Not configured","detail":"Not compliant.","remediation":"Set registry value HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\Terminal Services\\SecurityLayer (DWord) to 2.","auditOnly":false,"rebootRequired":false,"rationale":"The native RDP security layer does not authenticate the server, allowing man-in-the-middle interception.","impact":"","benchmark":"CIS: Require use of specific security layer for remote (RDP) connections = SSL","mitreAttack":["T1557"],"links":[]},{"id":"RDP-003","title":"RDP client connection encryption level is High","category":"RemoteDesktop","severity":"Medium","status":"Pass","expected":"3","actual":"3","detail":"Compliant.","remediation":"Set registry value HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\Terminal Services\\MinEncryptionLevel (DWord) to 3.","auditOnly":false,"rebootRequired":false,"rationale":"Requires 128-bit encryption for RDP sessions that do not use TLS.","impact":"","benchmark":"CIS: Set client connection encryption level = High Level","mitreAttack":["T1040"],"links":[]},{"id":"RDP-004","title":"RDP always prompts for a password","category":"RemoteDesktop","severity":"Medium","status":"Pass","expected":"1","actual":"1","detail":"Compliant.","remediation":"Set registry value HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\Terminal Services\\fPromptForPassword (DWord) to 1.","auditOnly":false,"rebootRequired":false,"rationale":"Prevents RDP connections that reuse credentials stored in an attacker-controlled .rdp file or client.","impact":"","benchmark":"CIS: Always prompt for password upon connection = Enabled","mitreAttack":["T1021.001","T1078"],"links":[]},{"id":"RDP-005","title":"RDP clients cannot save passwords","category":"RemoteDesktop","severity":"Medium","status":"Fail","expected":"1","actual":"Not configured","detail":"Not compliant.","remediation":"Set registry value HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\Terminal Services\\DisablePasswordSaving (DWord) to 1.","auditOnly":false,"rebootRequired":false,"rationale":"Saved RDP credentials in Credential Manager are a common target for credential harvesting.","impact":"","benchmark":"CIS: Do not allow passwords to be saved = Enabled","mitreAttack":["T1555.004"],"links":[]},{"id":"RDP-006","title":"RDP drive redirection is disabled","category":"RemoteDesktop","severity":"Medium","status":"Pass","expected":"1","actual":"1","detail":"Compliant.","remediation":"Set registry value HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\Terminal Services\\fDisableCdm (DWord) to 1.","auditOnly":false,"rebootRequired":false,"rationale":"Mapped client drives provide an easy path to copy tools onto the server and exfiltrate data.","impact":"Administrators can no longer copy files through mapped drives in RDP sessions.","benchmark":"CIS: Do not allow drive redirection = Enabled","mitreAttack":["T1105","T1048"],"links":[]},{"id":"NET-001","title":"LLMNR (multicast name resolution) is disabled","category":"Network","severity":"High","status":"Fail","expected":"0","actual":"Not configured","detail":"Not compliant.","remediation":"Set registry value HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\DNSClient\\EnableMulticast (DWord) to 0.","auditOnly":false,"rebootRequired":false,"rationale":"LLMNR responses can be spoofed by any host on the subnet to capture NTLM hashes (Responder-style attacks).","impact":"","benchmark":"CIS: Turn off multicast name resolution = Enabled","mitreAttack":["T1557.001"],"links":[]},{"id":"NET-002","title":"NetBIOS name resolution uses P-node (no broadcasts)","category":"Network","severity":"Medium","status":"Pass","expected":"2","actual":"2","detail":"Compliant.","remediation":"Set registry value HKLM:\\SYSTEM\\CurrentControlSet\\Services\\NetBT\\Parameters\\NodeType (DWord) to 2.","auditOnly":false,"rebootRequired":false,"rationale":"P-node stops NetBIOS broadcast name queries, which are poisoned in the same way as LLMNR.","impact":"NetBIOS names are then resolved only through WINS; environments that rely on broadcast resolution must use DNS.","benchmark":"CIS: NetBT NodeType configuration = P-node","mitreAttack":["T1557.001"],"links":[]},{"id":"NET-003","title":"IP source routing is disabled","category":"Network","severity":"Low","status":"Pass","expected":"2","actual":"2","detail":"Compliant.","remediation":"Set registry value HKLM:\\SYSTEM\\CurrentControlSet\\Services\\Tcpip\\Parameters\\DisableIPSourceRouting (DWord) to 2.","auditOnly":false,"rebootRequired":false,"rationale":"Source-routed packets let an attacker dictate the network path and bypass filtering.","impact":"","benchmark":"CIS: MSS: (DisableIPSourceRouting) IP source routing protection level = Highest protection, source routing is completely disabled","mitreAttack":[],"links":[]},{"id":"NET-004","title":"ICMP redirects cannot override routes","category":"Network","severity":"Low","status":"Fail","expected":"0","actual":"Not configured","detail":"Not compliant.","remediation":"Set registry value HKLM:\\SYSTEM\\CurrentControlSet\\Services\\Tcpip\\Parameters\\EnableICMPRedirect (DWord) to 0.","auditOnly":false,"rebootRequired":false,"rationale":"Forged ICMP redirects can reroute server traffic through an attacker-controlled host.","impact":"","benchmark":"CIS: MSS: (EnableICMPRedirect) Allow ICMP redirects to override OSPF generated routes = Disabled","mitreAttack":["T1557"],"links":[]},{"id":"NET-005","title":"SSL 2.0 is disabled for server connections","category":"Network","severity":"High","status":"Pass","expected":"0","actual":"0","detail":"Compliant.","remediation":"Set registry value HKLM:\\SYSTEM\\CurrentControlSet\\Control\\SecurityProviders\\SCHANNEL\\Protocols\\SSL 2.0\\Server\\Enabled (DWord) to 0.","auditOnly":false,"rebootRequired":false,"rationale":"SSL 2.0 is fundamentally broken and must never be negotiated.","impact":"","benchmark":"Microsoft guidance: TLS/SSL settings (SCHANNEL protocols)","mitreAttack":["T1557","T1040"],"links":[]},{"id":"NET-006","title":"SSL 3.0 is disabled for server connections","category":"Network","severity":"High","status":"Fail","expected":"0","actual":"Not configured","detail":"Not compliant.","remediation":"Set registry value HKLM:\\SYSTEM\\CurrentControlSet\\Control\\SecurityProviders\\SCHANNEL\\Protocols\\SSL 3.0\\Server\\Enabled (DWord) to 0.","auditOnly":false,"rebootRequired":false,"rationale":"SSL 3.0 is vulnerable to POODLE and must not be offered by servers.","impact":"","benchmark":"Microsoft guidance: TLS/SSL settings (SCHANNEL protocols)","mitreAttack":["T1557","T1040"],"links":[]},{"id":"WU-001","title":"Automatic Updates are enabled by policy","category":"WindowsUpdate","severity":"High","status":"Pass","expected":"0","actual":"0","detail":"Compliant.","remediation":"Set registry value HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsUpdate\\AU\\NoAutoUpdate (DWord) to 0.","auditOnly":false,"rebootRequired":false,"rationale":"Unpatched servers are the most common root cause of successful intrusions.","impact":"If updates are managed by WSUS, SCCM or Azure Update Manager, exclude the WU controls or align them with that tooling.","benchmark":"CIS: Configure Automatic Updates = Enabled","mitreAttack":["T1190","T1210"],"links":[]},{"id":"WU-002","title":"Updates are downloaded automatically and installed on a schedule","category":"WindowsUpdate","severity":"Medium","status":"Pass","expected":"4","actual":"4","detail":"Compliant.","remediation":"Set registry value HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsUpdate\\AU\\AUOptions (DWord) to 4.","auditOnly":false,"rebootRequired":false,"rationale":"Option 4 (auto download and schedule the install) ensures patches are applied without depending on manual action.","impact":"The server installs updates and may restart at the scheduled time (see WU-003).","benchmark":"CIS: Configure Automatic Updates = 4 - Auto download and schedule the install","mitreAttack":["T1190"],"links":[]},{"id":"WU-003","title":"Scheduled install day is configured","category":"WindowsUpdate","severity":"Low","status":"Pass","expected":"0","actual":"0","detail":"Compliant.","remediation":"Set registry value HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsUpdate\\AU\\ScheduledInstallDay (DWord) to 0.","auditOnly":false,"rebootRequired":false,"rationale":"A defined install day (0 = every day) keeps the patch window predictable and short.","impact":"","benchmark":"CIS: Configure Automatic Updates: Scheduled install day = 0 - Every day","mitreAttack":[],"links":[]},{"id":"WU-004","title":"Security updates were installed recently","category":"WindowsUpdate","severity":"High","status":"Pass","expected":"\u003c= 35","actual":"35","detail":"Compliant.","remediation":"Manual: Install the latest cumulative update through Windows Update, WSUS or your patch management tool.","auditOnly":true,"rebootRequired":false,"rationale":"Microsoft ships cumulative security updates monthly; a server without an update in more than about a month is missing security fixes.","impact":"","benchmark":"Patch management best practice","mitreAttack":["T1190","T1210","T1068"],"links":[]},{"id":"WU-005","title":"No software updates are pending installation","category":"WindowsUpdate","severity":"High","status":"Pass","expected":"0","actual":"0","detail":"Compliant.","remediation":"Manual: Install pending updates and restart during the next maintenance window.","auditOnly":true,"rebootRequired":false,"rationale":"Approved but uninstalled updates leave known vulnerabilities open.","impact":"The scan queries Windows Update or WSUS and can take several minutes. Set the profile parameter SkipPendingUpdateScan to true to skip it.","benchmark":"Patch management best practice","mitreAttack":["T1190","T1210"],"links":[]}]}</script>
<script>
(function () {
  'use strict';
  var data = JSON.parse(document.getElementById('report-data').textContent);
  var STATUS_LABEL = { Pass: 'Pass', Fixed: 'Remediated', Fail: 'Fail', Error: 'Error', NotApplicable: 'N/A' };
  var STATUS_ORDER = { Error: 0, Fail: 1, Fixed: 2, Pass: 3, NotApplicable: 4 };
  var SEVERITY_ORDER = { Critical: 0, High: 1, Medium: 2, Low: 3 };
  var SEP = ' ' + String.fromCharCode(183) + ' ';
  var state = { status: 'Open', severity: 'All', query: '' };

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    var key;
    if (attrs) {
      for (key in attrs) {
        if (!attrs.hasOwnProperty(key) || attrs[key] === null || attrs[key] === undefined) { continue; }
        if (key === 'text') { node.textContent = attrs[key]; }
        else if (key === 'cls') { node.className = attrs[key]; }
        else if (key.indexOf('on') === 0) { node.addEventListener(key.substring(2), attrs[key]); }
        else { node.setAttribute(key, attrs[key]); }
      }
    }
    (children || []).forEach(function (child) {
      if (child === null || child === undefined) { return; }
      node.appendChild(typeof child === 'string' ? document.createTextNode(child) : child);
    });
    return node;
  }

  function svg(tag, attrs) {
    var node = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (var key in attrs) { if (attrs.hasOwnProperty(key)) { node.setAttribute(key, attrs[key]); } }
    return node;
  }

  function fmtDate(value) {
    if (!value) { return '-'; }
    var d = new Date(value);
    return isNaN(d.getTime()) ? String(value) : d.toLocaleString();
  }

  function attackUrl(id) {
    return 'https://attack.mitre.org/techniques/' + id.replace('.', '/') + '/';
  }

  function scoreColor(score) {
    if (score === null || score === undefined) { return 'var(--na)'; }
    if (score >= 90) { return 'var(--pass)'; }
    if (score >= 70) { return 'var(--medium)'; }
    return 'var(--error)';
  }

  var s = data.summary;
  var sys = data.system;
  var sess = data.session;

  document.getElementById('subtitle').textContent = sys.computerName + SEP + (sys.osName || 'Unknown OS') + SEP + fmtDate(sess.startTime);
  var badges = document.getElementById('badges');
  badges.appendChild(el('span', { cls: 'badge mode', text: sess.mode === 'Remediate' ? 'Remediation run' : 'Audit (read-only)' }));
  badges.appendChild(el('span', { cls: 'badge', text: 'Profile: ' + sess.profile }));
  if (data.isSample) { badges.appendChild(el('span', { cls: 'badge sample', text: 'Sample data' })); }

  var app = document.getElementById('app');

  // Overview: score ring + counters + open findings by severity
  var radius = 70, circumference = 2 * Math.PI * radius;
  var pct = (s.score === null || s.score === undefined) ? 0 : s.score;
  var ring = svg('svg', { width: '168', height: '168', viewBox: '0 0 168 168', 'aria-hidden': 'true' });
  ring.appendChild(svg('circle', { cx: '84', cy: '84', r: String(radius), fill: 'none', stroke: 'var(--ring-track)', 'stroke-width': '14' }));
  ring.appendChild(svg('circle', { cx: '84', cy: '84', r: String(radius), fill: 'none', stroke: scoreColor(s.score), 'stroke-width': '14', 'stroke-linecap': 'round',
    'stroke-dasharray': String(circumference), 'stroke-dashoffset': String(circumference * (1 - pct / 100)) }));

  var scoreCard = el('section', { cls: 'card pad score', 'aria-label': 'Security score' }, [
    el('h2', { text: 'Security score' }),
    el('div', { cls: 'ring' }, [ring, el('div', { cls: 'value' }, [
      el('strong', { text: (s.score === null || s.score === undefined) ? 'n/a' : String(s.score) }),
      el('span', { text: 'out of 100' })
    ])]),
    el('div', { cls: 'grade' }, ['Grade ', el('b', { text: s.grade }), SEP + (s.complianceRate === null ? 'n/a' : s.complianceRate + '%') + ' of evaluated controls compliant'])
  ]);

  var open = s.openBySeverity;
  var openTotal = open.critical + open.high + open.medium + open.low;
  var sevBar = el('div', { cls: 'sev-bar', role: 'img', 'aria-label': 'Open findings by severity' });
  [['critical', 'Critical'], ['high', 'High'], ['medium', 'Medium'], ['low', 'Low']].forEach(function (pair) {
    if (open[pair[0]] > 0) { sevBar.appendChild(el('span', { style: 'width:' + (open[pair[0]] / openTotal * 100) + '%;background:var(--' + pair[0] + ')' })); }
  });
  var legend = el('div', { cls: 'legend' });
  [['critical', 'Critical'], ['high', 'High'], ['medium', 'Medium'], ['low', 'Low']].forEach(function (pair) {
    legend.appendChild(el('span', null, [el('i', { style: 'background:var(--' + pair[0] + ')' }), pair[1] + ': ' + open[pair[0]]]));
  });

  var stats = el('div', { cls: 'grid stats' }, [
    el('div', { cls: 'stat pass' }, [el('div', { cls: 'n', text: String(s.pass) }), el('div', { cls: 'l', text: 'Compliant' })]),
    el('div', { cls: 'stat fixed' }, [el('div', { cls: 'n', text: String(s.fixed) }), el('div', { cls: 'l', text: 'Remediated' })]),
    el('div', { cls: 'stat fail' }, [el('div', { cls: 'n', text: String(s.fail) }), el('div', { cls: 'l', text: 'Non-compliant' })]),
    el('div', { cls: 'stat error' }, [el('div', { cls: 'n', text: String(s.error) }), el('div', { cls: 'l', text: 'Errors' })]),
    el('div', { cls: 'stat na' }, [el('div', { cls: 'n', text: String(s.notApplicable) }), el('div', { cls: 'l', text: 'Not applicable' })])
  ]);

  var findingsCard = el('section', { cls: 'card pad', 'aria-label': 'Summary' }, [
    el('h2', { text: 'Results' }),
    stats,
    el('h2', { text: 'Open findings by severity (' + openTotal + ')', style: 'margin-top:20px' }),
    openTotal > 0 ? sevBar : el('p', { text: 'No open findings.', style: 'margin:4px 0 10px;color:var(--pass);font-weight:500' }),
    legend,
    s.rebootRequired ? el('div', { cls: 'notice', text: 'One or more remediated settings take effect only after a restart.' }) : null
  ]);

  app.appendChild(el('div', { cls: 'grid overview' }, [scoreCard, findingsCard]));

  // System and session details
  function meta(label, value) { return el('div', null, [el('dt', { text: label }), el('dd', { text: (value === null || value === undefined || value === '') ? '-' : String(value) })]); }
  app.appendChild(el('section', { cls: 'card pad', style: 'margin-top:16px', 'aria-label': 'System' }, [
    el('h2', { text: 'System' }),
    el('dl', { cls: 'meta' }, [
      meta('Computer', sys.computerName), meta('Operating system', sys.osName), meta('Version / build', sys.osVersion + ' / ' + sys.osBuild),
      meta('Role', sys.role), meta('Domain', sys.domain), meta('Last boot', fmtDate(sys.lastBootTime)),
      meta('Profile', sess.profile), meta('Started', fmtDate(sess.startTime)), meta('Duration', sess.durationSeconds + ' s'),
      meta('Session', sess.id), meta('PowerShell', sys.powerShellVersion), meta('Elevated', sys.isElevated ? 'Yes' : 'No')
    ])
  ]));

  // Category breakdown
  var catTable = el('table', null, []);
  var catBody = el('tbody');
  s.categories.slice().sort(function (a, b) { return (a.rate === null ? 101 : a.rate) - (b.rate === null ? 101 : b.rate); }).forEach(function (c) {
    var rate = c.rate === null ? 0 : c.rate;
    catBody.appendChild(el('tr', null, [
      el('td', { cls: 'name', text: c.name }),
      el('td', null, [el('div', { cls: 'bar' }, [el('span', { style: 'width:' + rate + '%;background:' + scoreColor(c.rate) })])]),
      el('td', { cls: 'num', text: (c.rate === null ? 'n/a' : c.rate + '%') + '  (' + c.compliant + '/' + c.evaluated + ')' })
    ]));
  });
  catTable.appendChild(catBody);
  app.appendChild(el('section', { cls: 'card pad cats', style: 'margin-top:16px', 'aria-label': 'Categories' }, [el('h2', { text: 'Compliance by category' }), catTable]));

  // Findings table with filters
  var results = data.results.slice().sort(function (a, b) {
    return (STATUS_ORDER[a.status] - STATUS_ORDER[b.status]) || (SEVERITY_ORDER[a.severity] - SEVERITY_ORDER[b.severity]) || (a.id < b.id ? -1 : 1);
  });

  function countWhere(fn) { var n = 0; results.forEach(function (r) { if (fn(r)) { n++; } }); return n; }
  var filters = [
    ['Open', 'Open issues', function (r) { return r.status === 'Fail' || r.status === 'Error'; }],
    ['All', 'All', function () { return true; }],
    ['Fixed', 'Remediated', function (r) { return r.status === 'Fixed'; }],
    ['Pass', 'Compliant', function (r) { return r.status === 'Pass'; }],
    ['NotApplicable', 'N/A', function (r) { return r.status === 'NotApplicable'; }]
  ];
  var filterFn = {};
  var chips = el('div', { cls: 'chips', role: 'group', 'aria-label': 'Filter by status' });
  filters.forEach(function (f) {
    filterFn[f[0]] = f[2];
    var chip = el('button', { cls: 'chip', type: 'button', 'aria-pressed': String(state.status === f[0]), 'data-status': f[0], onclick: function () {
      state.status = f[0];
      Array.prototype.forEach.call(chips.querySelectorAll('.chip'), function (c) { c.setAttribute('aria-pressed', String(c.getAttribute('data-status') === f[0])); });
      render();
    } }, [f[1], el('span', { cls: 'c', text: String(countWhere(f[2])) })]);
    chips.appendChild(chip);
  });
  if (countWhere(filters[0][2]) === 0) { state.status = 'All'; chips.querySelector('[data-status="All"]').setAttribute('aria-pressed', 'true'); chips.querySelector('[data-status="Open"]').setAttribute('aria-pressed', 'false'); }

  var severitySelect = el('select', { 'aria-label': 'Filter by severity', onchange: function (e) { state.severity = e.target.value; render(); } },
    ['All', 'Critical', 'High', 'Medium', 'Low'].map(function (v) { return el('option', { value: v, text: v === 'All' ? 'All severities' : v }); }));
  var search = el('input', { type: 'search', placeholder: 'Search ID, title, category, ATT&CK...', 'aria-label': 'Search findings', oninput: function (e) { state.query = e.target.value.toLowerCase(); render(); } });

  var tbody = el('tbody');
  var table = el('table', { cls: 'results' }, [
    el('thead', null, [el('tr', null, [el('th', { text: 'Severity' }), el('th', { text: 'ID' }), el('th', { text: 'Control' }), el('th', { text: 'Category' }), el('th', { text: 'Status' }), el('th', { text: 'Current value' })])]),
    tbody
  ]);
  var empty = el('div', { cls: 'empty hidden', text: 'No findings match the current filters.' });
  app.appendChild(el('section', { cls: 'card', style: 'margin-top:16px', 'aria-label': 'Findings' }, [
    el('div', { cls: 'toolbar' }, [chips, el('span', { cls: 'spacer' }), severitySelect, search]),
    table, empty
  ]));

  function detailRow(r) {
    var items = [];
    function add(label, value, isCode) {
      if (value === null || value === undefined || value === '') { return; }
      items.push(el('dt', { text: label }));
      items.push(el('dd', null, [isCode ? el('code', { text: value }) : value]));
    }
    add('Why it matters', r.rationale);
    add('Expected', r.expected, true);
    add('Current', r.actual, true);
    add('Result', r.detail);
    add('Remediation', r.remediation);
    add('Operational impact', r.impact);
    add('Benchmark', r.benchmark);
    if (r.mitreAttack && r.mitreAttack.length) {
      items.push(el('dt', { text: 'MITRE ATT&CK' }));
      items.push(el('dd', { cls: 'tags' }, r.mitreAttack.map(function (t) { return el('a', { href: attackUrl(t), target: '_blank', rel: 'noopener noreferrer', text: t }); })));
    }
    if (r.links && r.links.length) {
      items.push(el('dt', { text: 'References' }));
      items.push(el('dd', null, r.links.map(function (l) { return el('div', null, [el('a', { href: l, target: '_blank', rel: 'noopener noreferrer', text: l })]); })));
    }
    if (r.rebootRequired) { add('Restart', 'Required for this change to take effect.'); }
    return el('tr', { cls: 'details hidden' }, [el('td', { colspan: '6' }, [el('dl', { cls: 'kv' }, items)])]);
  }

  var rows = results.map(function (r) {
    var details = detailRow(r);
    var toggle = function () { details.classList.toggle('hidden'); row.setAttribute('aria-expanded', String(!details.classList.contains('hidden'))); };
    var row = el('tr', { cls: 'row', tabindex: '0', 'aria-expanded': 'false', onclick: toggle, onkeydown: function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } } }, [
      el('td', null, [el('span', { cls: 'sev sev-' + r.severity, text: r.severity })]),
      el('td', { cls: 'id', text: r.id }),
      el('td', { cls: 'title', text: r.title }),
      el('td', { text: r.category }),
      el('td', null, [el('span', { cls: 'pill st-' + r.status, text: STATUS_LABEL[r.status] || r.status })]),
      el('td', { cls: 'actual', text: r.actual || '-' })
    ]);
    tbody.appendChild(row);
    tbody.appendChild(details);
    var haystack = [r.id, r.title, r.category, r.status, r.actual, r.benchmark].concat(r.mitreAttack || []).join(' ').toLowerCase();
    return { data: r, row: row, details: details, haystack: haystack };
  });

  function render() {
    var visible = 0;
    rows.forEach(function (item) {
      var show = filterFn[state.status](item.data) &&
        (state.severity === 'All' || item.data.severity === state.severity) &&
        (!state.query || item.haystack.indexOf(state.query) !== -1);
      item.row.classList.toggle('hidden', !show);
      if (!show) { item.details.classList.add('hidden'); item.row.setAttribute('aria-expanded', 'false'); }
      if (show) { visible++; }
    });
    empty.classList.toggle('hidden', visible !== 0);
  }
  render();

  var footer = document.getElementById('footer');
  footer.appendChild(document.createTextNode('Generated by ' + data.generator.name + ' v' + data.generator.version + SEP));
  footer.appendChild(el('a', { href: data.generator.url, target: '_blank', rel: 'noopener noreferrer', text: 'Project on GitHub' }));
  footer.appendChild(document.createTextNode(SEP + 'Benchmark mappings reference CIS recommendation titles; verify against the benchmark version your organisation has adopted.'));
})();
</script>
</body>
</html>
