name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Pester
        shell: pwsh
        run: Install-Module -Name Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Test
        shell: pwsh
        run: ./build.ps1 -Task Test -CI

      - name: Package
        id: package
        shell: pwsh
        run: |
          $version = (Import-PowerShellDataFile -Path src/WindowsServerHardening/WindowsServerHardening.psd1).ModuleVersion
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
              throw "Tag $env:GITHUB_REF_NAME does not match the module version $version."
          }
          New-Item -ItemType Directory -Path out/package -Force | Out-Null
          Copy-Item -Path src/WindowsServerHardening -Destination out/package -Recurse
          Copy-Item -Path Harden-WindowsServer.ps1, README.md, LICENSE, CHANGELOG.md -Destination out/package
          Compress-Archive -Path out/package/* -DestinationPath "out/WindowsServerHardening-$version.zip"
          $hash = (Get-FileHash -Path "out/WindowsServerHardening-$version.zip" -Algorithm SHA256).Hash
          "$hash  WindowsServerHardening-$version.zip" | Set-Content -Path "out/WindowsServerHardening-$version.zip.sha256"

          # Release notes: install instructions followed by this version's CHANGELOG section.
          $changelog = Get-Content -Path CHANGELOG.md -Raw
          $section = [regex]::Match($changelog, "(?ms)^## \[$([regex]::Escape($version))\][^\n]*\n(.*?)(?=^## \[|\z)")
          if (-not $section.Success) { throw "CHANGELOG.md has no section for version $version." }
          $install = @(
              '## Install'
              ''
              "1. Download ``WindowsServerHardening-$version.zip`` and verify it against the ``.sha256`` file: ``Get-FileHash .\WindowsServerHardening-$version.zip``"
              '2. Extract it, then in an elevated PowerShell run `Get-ChildItem -Recurse | Unblock-File`'
              '3. Audit (read-only): `.\Harden-WindowsServer.ps1`, or preview hardening with `.\Harden-WindowsServer.ps1 -Mode Harden -WhatIf`'
              ''
              'Supports Windows Server 2012 to 2025 on Windows PowerShell 5.1 and PowerShell 7. See docs/COMPATIBILITY.md in the repository.'
              ''
          ) -join "`n"
          Set-Content -Path out/release-notes.md -Value ($install + "`n" + $section.Groups[1].Value.Trim()) -Encoding utf8

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: Windows Server Hardening Toolkit ${{ github.ref_name }}
          body_path: out/release-notes.md
          files: |
            out/*.zip
            out/*.sha256
          generate_release_notes: true
