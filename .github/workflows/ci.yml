name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Analyze
        shell: pwsh
        run: ./build.ps1 -Task Analyze

  test:
    name: Unit tests (${{ matrix.os }}, ${{ matrix.shell == 'powershell' && 'PowerShell 5.1' || 'PowerShell 7' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Pester
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-Module -Name Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run tests
        run: ./build.ps1 -Task Test -CI

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-${{ matrix.os }}-${{ matrix.shell }}
          path: out/

  integration:
    # GitHub-hosted runners are disposable Windows Server VMs with administrator rights, so the full
    # audit -> harden -> verify -> roll back lifecycle runs against a real operating system.
    name: Integration (${{ matrix.os }}, ${{ matrix.shell == 'powershell' && 'PowerShell 5.1' || 'PowerShell 7' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7

      - name: Audit, harden, verify, roll back
        run: ./tests/Integration/Invoke-IntegrationTest.ps1 -Force -OutputPath "$env:RUNNER_TEMP/wsh-integration"

      - name: Upload evidence and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-${{ matrix.os }}-${{ matrix.shell }}
          path: ${{ runner.temp }}/wsh-integration/

  docs:
    name: Generated docs are up to date
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Regenerate control reference and sample report
        shell: powershell
        run: ./build.ps1 -Task Docs, SampleReport

      - name: Check for drift
        shell: pwsh
        run: |
          git diff --exit-code -- docs/
          if ($LASTEXITCODE -ne 0) { throw 'docs/ is out of date. Run ./build.ps1 -Task Docs, SampleReport and commit the result.' }
