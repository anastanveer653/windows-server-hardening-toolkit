    --pass: #4cc38a; --pass-soft: #15291f; --fixed: #6aa7f0; --fixed-soft: #182638;
    --fail: #f2994a; --fail-soft: #2e2116; --error: #f97066; --error-soft: #321a19; --na: #98a2b3; --na-soft: #222a34;
    --critical: #f97066; --high: #f38744; --medium: #e3b341; --low: #98a2b3;
    --ring-track: #273140; --shadow: 0 1px 2px rgba(0, 0, 0, .4);

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif; }

.brand { display: flex; align-items: center; gap: 12px; flex: 1 1 auto; min-width: 260px; }
.brand svg { flex: none; }
.brand h1 { font-size: 18px; margin: 0; font-weight: 600; letter-spacing: -.01em; }

.badges { display: flex; gap: 8px; flex-wrap: wrap; }

.badge.mode { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

.grid { display: grid; gap: 16px; }
.overview { grid-template-columns: minmax(260px, 320px) 1fr; }

.pad { padding: 20px; }
.score { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.score .ring { position: relative; width: 168px; height: 168px; }
.score .ring svg { transform: rotate(-90deg); }

.toolbar .spacer { flex: 1 1 auto; }
.toolbar input, .toolbar select { font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
.toolbar input { min-width: 220px; }

table.results th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--surface-2); position: sticky; top: 0; }
table.results td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
table.results tr.row { cursor: pointer; }
table.results tr.row:hover td { background: var(--surface-2); }

table.results .id { font-family: Consolas, "Cascadia Mono", Menlo, monospace; font-size: 12px; white-space: nowrap; color: var(--muted); }
table.results .title { font-weight: 500; }

.st-Pass { background: var(--pass-soft); color: var(--pass); } .st-Fixed { background: var(--fixed-soft); color: var(--fixed); }

.sev { font-weight: 600; font-size: 12px; white-space: nowrap; }

@media (max-width: 700px) { .kv { grid-template-columns: 1fr; } }
.kv dt { color: var(--muted); font-size: 12px; padding-top: 2px; }
.kv dd { margin: 0; overflow-wrap: anywhere; }

.tags a { display: inline-block; margin: 0 6px 4px 0; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); text-decoration: none; }
.empty { padding: 32px; text-align: center; color: var(--muted); }
footer { color: var(--muted); font-size: 12px; text-align: center; padding: 24px 0 40px; }
.hidden { display: none; }
@media print {
  body { background: #fff; }
  .toolbar { display: none; }
  .card { box-shadow: none; break-inside: avoid; }
  table.results th { position: static; }
}
</style>

  var rows = results.map(function (r) {
    var details = detailRow(r);
    var toggle = function () { details.classList.toggle('hidden'); row.setAttribute('aria-expanded', String(!details.classList.contains('hidden'))); };
    var row = el('tr', { cls: 'row', tabindex: '0', 'aria-expanded': 'false', onclick: toggle, onkeydown: function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } } }, [
      el('td', null, [el('span', { cls: 'sev sev-' + r.severity, text: r.severity })]),
      el('td', { cls: 'id', text: r.id }),
      el('td', { cls: 'title', text: r.title }),
      el('td', { text: r.category }),
      el('td', null, [el('span', { cls: 'pill st-' + r.status, text: STATUS_LABEL[r.status] || r.status })]),
      el('td', { cls: 'actual', text: r.actual || '-' })
    ]);
    tbody.appendChild(row);
    tbody.appendChild(details);
    var haystack = [r.id, r.title, r.category, r.status, r.actual, r.benchmark].concat(r.mitreAttack || []).join(' ').toLowerCase();
    return { data: r, row: row, details: details, haystack: haystack };
  });

  function render() {
    var visible = 0;
    rows.forEach(function (item) {
      var show = filterFn[state.status](item.data) &&
        (state.severity === 'All' || item.data.severity === state.severity) &&
        (!state.query || item.haystack.indexOf(state.query) !== -1);
      item.row.classList.toggle('hidden', !show);
      if (!show) { item.details.classList.add('hidden'); item.row.setAttribute('aria-expanded', 'false'); }
      if (show) { visible++; }
    });
    empty.classList.toggle('hidden', visible !== 0);
  }
  render();

  var footer = document.getElementById('footer');
  footer.appendChild(document.createTextNode('Generated by ' + data.generator.name + ' v' + data.generator.version + SEP));
  footer.appendChild(el('a', { href: data.generator.url, target: '_blank', rel: 'noopener noreferrer', text: 'Project on GitHub' }));
  footer.appendChild(document.createTextNode(SEP + 'Benchmark mappings reference CIS recommendation titles; verify against the benchmark version your organisation has adopted.'));
})();
</script>
